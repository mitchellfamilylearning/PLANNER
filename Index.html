<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Week Ahead — Lesson Ledger</title>
<meta name="theme-color" content="#17242B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Week Ahead">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%2317242B'/%3E%3Cpath d='M7 11h18M7 16h18M7 21h18M13 8v16' stroke='%23CBD8D1' stroke-width='1.6'/%3E%3Cpath d='M17.5 18.5l2 2 4-4.5' stroke='%23D9992E' stroke-width='2.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root{
    --ink:#17242B;
    --ink-soft:#42565F;
    --paper:#FBFAF6;
    --card:#FFFFFF;
    --rule:#CBD8D1;
    --rule-soft:#E4EBE7;
    --moss:#2F5D50;
    --moss-dim:#4C7A6C;
    --marigold:#D9992E;
    --brick:#9E4B37;
    --shadow:0 1px 2px rgba(23,36,43,.06),0 8px 24px rgba(23,36,43,.06);
    --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--sans);color:var(--ink);background:var(--paper);
    font-size:14px;line-height:1.45;-webkit-text-size-adjust:100%;
  }

  .bar{
    background:var(--ink);color:#EDF1EF;padding:14px 20px;
    display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  }
  .mark{display:flex;align-items:baseline;gap:10px;margin-right:auto}
  .mark h1{font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:.01em;margin:0}
  .mark span{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#8FA9A0}
  .weeknav{display:flex;align-items:center;gap:8px}
  .weeknav .label{font-family:var(--mono);font-size:12px;letter-spacing:.04em;min-width:190px;text-align:center}
  .arrow{background:transparent;border:1px solid #3B4C55;color:#EDF1EF;width:30px;height:30px;border-radius:4px;cursor:pointer;font-size:15px;line-height:1}
  .arrow:hover{background:#22333B;border-color:#5A6E78}
  .today-btn{
    background:transparent;border:1px solid #3B4C55;color:#B9C9C3;font-family:var(--mono);
    font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:7px 11px;border-radius:4px;cursor:pointer;
  }
  .today-btn:hover{background:#22333B;color:#EDF1EF}
  .saved{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#6F8880;min-width:52px}

  .warn{background:#F7EEDC;border-bottom:1px solid var(--marigold);color:#6B4A12;padding:9px 20px;font-size:12.5px}
  .warn b{font-weight:700}

  .wrap{display:flex;align-items:flex-start}
  .rail{
    width:260px;flex:0 0 260px;border-right:1px solid var(--rule);
    padding:20px 18px 60px;min-height:calc(100vh - 58px);background:#F6F5F0;
  }
  .sheet{flex:1;min-width:0;padding:20px 22px 80px}
  .rail h2,.sheet h2{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 10px;font-weight:600}
  .rail section+section{margin-top:26px}

  .roster{list-style:none;margin:0 0 10px;padding:0}
  .roster li{margin-bottom:6px}
  .student{
    display:flex;align-items:center;gap:8px;width:100%;background:var(--card);
    border:1px solid var(--rule-soft);border-left:3px solid transparent;border-radius:5px;
    padding:9px 10px;cursor:pointer;text-align:left;font-family:inherit;font-size:14px;color:var(--ink);
  }
  .student:hover{border-color:var(--rule)}
  .student.on{border-left-color:var(--moss);border-color:var(--rule);box-shadow:var(--shadow)}
  .student .nm{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .student .gr{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--ink-soft);background:#EEF2F0;border-radius:3px;padding:2px 5px;white-space:nowrap}
  .rowbtns{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
  .mini{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;background:none;border:none;color:var(--ink-soft);cursor:pointer;padding:3px 5px;border-radius:3px}
  .mini:hover{background:#E7ECE9;color:var(--ink)}
  .mini.danger:hover{background:#F6E7E3;color:var(--brick)}

  .subs{list-style:none;margin:0 0 10px;padding:0}
  .subs li{display:flex;align-items:center;gap:6px;padding:6px 8px;border-bottom:1px solid var(--rule-soft)}
  .subs li.ed{flex-direction:column;align-items:stretch;gap:5px;padding:8px}
  .subs .sname{
    flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    background:none;border:none;font:inherit;color:var(--ink);text-align:left;
    cursor:pointer;padding:3px 4px;border-radius:3px;
  }
  .subs .sname:hover{background:#E7ECE9}
  .subs .field{margin-top:0}
  .subs .ord{font-family:var(--mono);font-size:10px;color:#9BABA4;width:16px}
  .chiprow{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
  .chip{background:#EEF2F0;border:1px solid var(--rule-soft);border-radius:20px;font-size:11px;padding:4px 9px;cursor:pointer;color:var(--ink-soft);font-family:inherit}
  .chip:hover{background:#E2EAE6;color:var(--ink);border-color:var(--rule)}

  .field{display:flex;gap:6px;margin-top:8px}
  input[type=text]{font-family:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:4px;padding:7px 8px;width:100%;min-width:0}
  input[type=text]:focus{outline:2px solid var(--moss-dim);outline-offset:-1px;border-color:var(--moss-dim)}
  .btn{font-family:var(--sans);font-size:12px;font-weight:600;background:var(--moss);color:#fff;border:1px solid var(--moss);border-radius:4px;padding:8px 12px;cursor:pointer;white-space:nowrap}
  .btn:hover{background:#26493F}
  .btn.ghost{background:transparent;color:var(--ink-soft);border-color:var(--rule)}
  .btn.ghost:hover{background:#EEF2F0;color:var(--ink)}
  .btn.print{background:var(--ink);border-color:var(--ink)}
  .btn.print:hover{background:#0E181D}
  button:focus-visible,input:focus-visible,.student:focus-visible{outline:2px solid var(--marigold);outline-offset:2px}

  .sheethead{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:16px}
  .who{margin-right:auto}
  .who h3{font-family:var(--serif);font-size:26px;margin:0;font-weight:600;letter-spacing:.01em}
  .who p{margin:2px 0 0;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
  .tools{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  .toggle{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;color:var(--ink-soft);cursor:pointer;letter-spacing:.04em}

  .scroller{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .ledger{width:100%;border-collapse:collapse;background:var(--card);box-shadow:var(--shadow);border:1px solid var(--rule)}
  .ledger th,.ledger td{border:1px solid var(--rule-soft);vertical-align:top;padding:0}
  .ledger thead th{
    background:#EFF3F1;border-bottom:2px solid var(--rule);font-family:var(--mono);font-size:11px;
    font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);padding:9px 10px;text-align:left;
  }
  .ledger thead th .dnum{display:block;font-size:10px;letter-spacing:.06em;color:#9BABA4;text-transform:none;margin-top:1px}
  .ledger thead th.on{background:#F7EEDC;color:var(--ink);border-bottom-color:var(--marigold)}
  .ledger .subcell{width:158px;background:#F6F5F0;padding:9px 9px 8px;border-right:2px solid var(--rule)}
  .subwrap{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
  .subwrap .snm{font-family:var(--serif);font-size:16px;font-weight:600;line-height:1.25}
  .pullrow{
    font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;
    background:none;border:1px solid transparent;color:#93A29B;cursor:pointer;
    padding:2px 5px;border-radius:3px;line-height:1.5;
  }
  .pullrow:hover{background:#E7ECE9;border-color:var(--rule);color:var(--ink)}
  .pullrow.warn-arm{color:var(--brick);border-color:#E3C6BE;background:#F9EEEA}
  .ledger td.day{padding:6px 7px 8px;min-width:140px}
  .ledger td.day.on{background:#FEFCF6}

  .item{display:flex;align-items:center;gap:6px;margin-bottom:2px}
  .box{flex:0 0 auto;width:10px;height:10px;border:1.5px solid var(--rule);border-radius:2px}
  .item input{flex:1;min-width:0;border:none;background:transparent;padding:3px 0;font-family:inherit;font-size:13.5px;color:var(--ink);border-bottom:1px solid transparent}
  .item input::placeholder{color:#AFBDB7}
  .item input:focus{outline:none;border-bottom-color:var(--moss-dim)}
  .item:focus-within .box{border-color:var(--moss-dim)}
  .item .x{flex:0 0 auto;border:none;background:none;color:#B7C4BE;cursor:pointer;font-size:13px;line-height:1;padding:2px 4px;border-radius:3px;visibility:hidden}
  .item:hover .x,.item:focus-within .x{visibility:visible}
  .item .x:hover{color:var(--brick);background:#F6E7E3}

  .notes{margin-top:16px;background:var(--card);border:1px solid var(--rule);box-shadow:var(--shadow);padding:12px 14px}
  .notes label{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft);display:block;margin-bottom:6px}
  .notes textarea{
    width:100%;border:none;resize:vertical;min-height:52px;font-family:inherit;font-size:14px;color:var(--ink);
    background:repeating-linear-gradient(var(--card),var(--card) 21px,var(--rule-soft) 21px,var(--rule-soft) 22px);line-height:22px;
  }
  .notes textarea:focus{outline:none}

  .empty{background:var(--card);border:1px dashed var(--rule);border-radius:6px;padding:40px 30px;text-align:center;max-width:520px;margin:40px auto}
  .empty h3{font-family:var(--serif);font-size:22px;margin:0 0 8px}
  .empty p{color:var(--ink-soft);margin:0 0 18px}
  .hint{font-size:11px;color:#8A9992;margin-top:8px;font-family:var(--mono);letter-spacing:.03em;line-height:1.5}

  @media (max-width:880px){
    .wrap{flex-direction:column}
    .rail{width:100%;flex:1 1 auto;min-height:0;border-right:none;border-bottom:1px solid var(--rule);padding-bottom:24px}
    .sheet{padding:18px 14px 70px;width:100%}
    .mark h1{font-size:17px}
    .weeknav{width:100%;justify-content:space-between}
    .weeknav .label{min-width:0;flex:1}
    .ledger{min-width:760px}
  }

  /* ---------- touch devices of any size ---------- */
  button,.student,.chip,.sname{touch-action:manipulation}
  @media (hover:none){
    .item .x{visibility:visible;padding:7px 9px;font-size:15px}
    .mini{padding:6px 8px}
    .pullrow{padding:5px 7px}
  }

  /* ---------- phone: drawer + day view ---------- */
  .hamb{
    display:none;background:transparent;border:1px solid #3B4C55;color:#EDF1EF;
    width:34px;height:34px;border-radius:5px;cursor:pointer;font-size:15px;line-height:1;
  }
  .drawerhead{display:none}
  #weekSection{display:none}
  .scrim{
    position:fixed;inset:0;z-index:50;border:none;padding:0;margin:0;
    background:rgba(14,24,29,.45);opacity:0;pointer-events:none;transition:opacity .2s ease;
  }
  body.drawer .scrim{opacity:1;pointer-events:auto}

  @media (max-width:700px){
    body{font-size:15px}

    .bar{padding:10px 12px;gap:10px}
    .hamb{display:block;order:0}
    .mark{order:1}
    .mark h1{font-size:16px}
    .mark span{display:none}
    .saved{order:2;min-width:0;text-align:right}
    .weeknav{order:3;width:100%;gap:6px}
    .weeknav .label{min-width:0;flex:1;font-size:11.5px}
    .arrow{width:34px;height:34px;font-size:17px}
    .today-btn{padding:9px 10px}
    .warn{padding:10px 12px}

    .wrap{display:block}
    body.drawer{overflow:hidden}
    .rail{
      position:fixed;top:0;left:0;bottom:0;z-index:60;
      width:min(330px,88vw);flex:none;min-height:0;
      overflow-y:auto;-webkit-overflow-scrolling:touch;
      transform:translateX(-101%);transition:transform .22s ease;
      border-right:1px solid var(--rule);border-bottom:none;
      padding:14px 16px 70px;box-shadow:0 0 40px rgba(23,36,43,.28);
    }
    body.drawer .rail{transform:none}
    .drawerhead{
      display:flex;align-items:center;justify-content:space-between;
      margin:0 0 20px;padding-bottom:12px;border-bottom:1px solid var(--rule);
    }
    .drawerhead b{font-family:var(--serif);font-size:18px;font-weight:600}
    .drawerclose{
      background:none;border:1px solid var(--rule);border-radius:5px;color:var(--ink-soft);
      width:36px;height:36px;font-size:14px;line-height:1;cursor:pointer;
    }
    #weekSection{display:block}
    .drawertoggle{font-family:var(--sans);font-size:14px;color:var(--ink);gap:9px;padding:4px 0}
    .drawertoggle input{width:18px;height:18px}
    .student{padding:12px 11px}
    .subs li{padding:9px 8px}
    .chip{padding:7px 12px;font-size:12.5px}
    .btn{padding:11px 13px;font-size:13px}

    .sheet{padding:14px 12px 90px;width:100%}
    .sheethead{margin-bottom:12px;gap:10px}
    .who{margin-right:0;width:100%}
    .who h3{font-size:21px}
    .tools{width:100%;gap:6px}
    .tools .btn{flex:1 1 40%}
    .tools .btn.print{flex:1 1 100%;order:-1;padding:13px}

    .pstrip{display:flex;gap:6px;overflow-x:auto;padding-bottom:9px;margin-bottom:8px;-webkit-overflow-scrolling:touch}
    .pstrip button{
      flex:0 0 auto;background:var(--card);border:1px solid var(--rule-soft);border-radius:20px;
      padding:9px 15px;font-family:inherit;font-size:13.5px;color:var(--ink-soft);cursor:pointer;
    }
    .pstrip button.on{background:var(--ink);border-color:var(--ink);color:#EDF1EF;font-weight:600}

    .daytabs{
      display:flex;gap:5px;overflow-x:auto;-webkit-overflow-scrolling:touch;
      position:sticky;top:0;z-index:20;background:var(--paper);
      padding:9px 12px;margin:0 -12px 12px;border-bottom:1px solid var(--rule-soft);
    }
    .daytabs button{
      flex:1 0 auto;min-width:56px;background:var(--card);border:1px solid var(--rule-soft);
      border-radius:6px;padding:7px 6px;cursor:pointer;line-height:1.3;
      font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);
    }
    .daytabs button .dd{display:block;font-family:var(--sans);font-size:14px;letter-spacing:0;color:var(--ink);margin-top:1px}
    .daytabs button.today{border-color:var(--marigold)}
    .daytabs button.on{background:var(--ink);border-color:var(--ink);color:#8FA9A0}
    .daytabs button.on .dd{color:#fff}

    .scard{
      background:var(--card);border:1px solid var(--rule);border-radius:6px;
      box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden;
    }
    .scardhead{
      display:flex;align-items:center;gap:8px;padding:9px 12px;
      background:#F6F5F0;border-bottom:1px solid var(--rule-soft);
    }
    .scardhead .snm{font-family:var(--serif);font-size:17px;font-weight:600;flex:1;min-width:0}
    .scard .cell{padding:4px 12px 10px}
    .scard .item{min-height:42px;margin-bottom:0}
    .item input{font-size:16px;padding:8px 0}
    .box{width:13px;height:13px}
    .item .x{padding:9px 8px}

    .notes{padding:12px}
    .notes textarea{font-size:16px}
    .empty{padding:32px 20px;margin:24px auto}
  }

  #printroot{display:none}
  @media print{
    @page{size:landscape;margin:.4in}
    .bar,.warn,.wrap,.scrim{display:none !important}
    #printroot{display:block !important}
    body{background:#fff}
  }
  .psheet{page-break-after:always;font-family:Georgia,serif;color:#000}
  .psheet:last-child{page-break-after:auto}
  .phead{display:flex;align-items:flex-end;border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:10px}
  .phead h1{font-size:22pt;margin:0;font-weight:600;letter-spacing:.01em}
  .phead .pgrade{font-family:var(--mono);font-size:9pt;letter-spacing:.12em;text-transform:uppercase;margin-left:12px;padding-bottom:3px}
  .phead .pweek{margin-left:auto;font-family:var(--mono);font-size:10pt;letter-spacing:.06em;padding-bottom:3px}
  table.pgrid{width:100%;border-collapse:collapse;table-layout:fixed}
  table.pgrid th,table.pgrid td{border:1px solid #444;vertical-align:top}
  table.pgrid thead th{background:#EDEDED;font-family:var(--mono);font-size:8.5pt;letter-spacing:.08em;text-transform:uppercase;padding:5px 6px;text-align:left}
  table.pgrid thead th .pdate{display:block;font-size:7.5pt;letter-spacing:.04em;text-transform:none;color:#333}
  table.pgrid td.psub{width:14%;background:#F5F5F5;font-size:11pt;font-weight:600;padding:6px;border-right:2px solid #000}
  table.pgrid td.pday{padding:5px 6px;height:.95in}
  .pitem{display:flex;align-items:flex-start;gap:5px;font-size:9.5pt;line-height:1.3;margin-bottom:4px;font-family:var(--sans)}
  .pbox{flex:0 0 auto;width:10px;height:10px;border:1px solid #333;margin-top:2px}
  .pnotes{margin-top:9px;border:1px solid #444;padding:5px 7px;min-height:.6in}
  .pnotes b{font-family:var(--mono);font-size:8pt;letter-spacing:.14em;text-transform:uppercase;display:block;margin-bottom:3px}
  .pnotes .ptext{font-family:var(--sans);font-size:9.5pt;white-space:pre-wrap}
  .pfoot{margin-top:6px;font-family:var(--mono);font-size:7.5pt;letter-spacing:.08em;color:#666;display:flex;justify-content:space-between}
  .pfoot .plic{color:#999}
</style>
</head>
<body>

<div class="bar">
  <button class="hamb" data-act="opendrawer" aria-label="Students and subjects" aria-expanded="false" aria-controls="rail">☰</button>
  <div class="mark"><h1>The Week Ahead</h1><span>Lesson Ledger</span></div>
  <div class="weeknav">
    <button class="arrow" data-act="prevweek" aria-label="Previous week">‹</button>
    <div class="label" id="weeklabel">—</div>
    <button class="arrow" data-act="nextweek" aria-label="Next week">›</button>
    <button class="today-btn" data-act="thisweek">This week</button>
  </div>
  <div class="saved" id="savedFlag"></div>
</div>

<div class="warn" id="warnBar" style="display:none"></div>

<div class="wrap">
  <aside class="rail" id="rail">
    <div class="drawerhead">
      <b>Setup</b>
      <button class="drawerclose" data-act="closedrawer" aria-label="Close">✕</button>
    </div>

    <section>
      <h2>Students</h2>
      <ul class="roster" id="roster"></ul>
      <div class="field">
        <input type="text" id="newStudentName" placeholder="Name" autocomplete="off">
        <input type="text" id="newStudentGrade" placeholder="Grade" style="width:82px" autocomplete="off">
      </div>
      <div class="field"><button class="btn" data-act="addstudent">Add student</button></div>
    </section>

    <section id="subjectSection">
      <h2>Subjects</h2>
      <ul class="subs" id="subs"></ul>
      <div class="field">
        <input type="text" id="newSubject" placeholder="Add a subject" autocomplete="off">
        <button class="btn" data-act="addsubject">Add</button>
      </div>
      <div class="chiprow" id="chiprow"></div>
      <p class="hint">Tap a subject to rename it. Order sets the row order on the printed sheet.</p>
    </section>

    <section id="weekSection">
      <h2>Week</h2>
      <label class="toggle drawertoggle">
        <input type="checkbox" data-act="sat" id="satDrawer"> Include Saturday
      </label>
    </section>

    <section>
      <h2>Your file</h2>
      <div class="field">
        <button class="btn ghost" data-act="backup">Save a backup</button>
        <button class="btn ghost" data-act="restore">Restore</button>
      </div>
      <input type="file" id="restoreFile" accept="application/json,.json" style="display:none">
      <p class="hint" id="storeNote"></p>
    </section>

    <section>
      <h2>This copy</h2>
      <div class="field">
        <input type="text" id="licensee" placeholder="Your household name" autocomplete="off">
      </div>
      <p class="hint">Prints at the bottom of every sheet. Set it once.</p>
      <p class="hint" style="margin-top:18px;color:#A3B0AA">The Week Ahead · v<span id="verNum"></span></p>
    </section>
  </aside>

  <main class="sheet" id="sheet"></main>
</div>

<button class="scrim" data-act="closedrawer" aria-label="Close menu" tabindex="-1"></button>

<div id="printroot"></div>

<script>
(function(){
  "use strict";

  var DAYS=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  var DAYS_SHORT=["Mon","Tue","Wed","Thu","Fri","Sat"];
  var MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var MONTHS_LONG=["January","February","March","April","May","June","July","August","September","October","November","December"];
  var SUGGESTIONS=["Bible","Math","Grammar","Spelling","Reading","Writing","Science","History","Geography","Latin","Art","Music","P.E.","Handwriting","Logic","Typing"];
  var STORE_KEY="homeschool-planner-v1";
  var VERSION="1.2";
  var PHONE_Q="(max-width:700px)";

  var data={students:[],plans:{},settings:{saturday:false,licensee:""}};
  var activeId=null, weekStart=mondayOf(new Date()), saveTimer=null, armed=null;
  var editingSub=null;

  /* On a phone the seven-column grid can't survive, so the sheet becomes one
     day at a time. activeDay is which day that is. Desktop ignores it. */
  var activeDay=0;
  function isPhone(){
    try{ if(window.matchMedia) return window.matchMedia(PHONE_Q).matches; }catch(e){}
    return (window.innerWidth||1024)<=700;
  }
  var phoneMode=isPhone();
  /* Pointer events fire once for both touch and mouse; older engines fall back. */
  var DOWN=("onpointerdown" in window)?"pointerdown":"mousedown";

  /* ---------- storage: browser storage → memory ---------- */
  var Store=(function(){
    var mode="memory", mem=null;
    return {
      init:function(){
        try{ localStorage.setItem("__probe","1"); localStorage.removeItem("__probe"); mode="local"; }
        catch(e){ mode="memory"; }
        return mode;
      },
      mode:function(){return mode},
      get:function(k){
        if(mode==="local") return Promise.resolve(localStorage.getItem(k));
        return Promise.resolve(mem);
      },
      set:function(k,v){
        if(mode==="local"){ localStorage.setItem(k,v); return Promise.resolve(); }
        mem=v; return Promise.resolve();
      }
    };
  })();

  /* ---------- dates ---------- */
  function mondayOf(d){var c=new Date(d.getFullYear(),d.getMonth(),d.getDate());c.setDate(c.getDate()-((c.getDay()+6)%7));return c}
  function addDays(d,n){var c=new Date(d);c.setDate(c.getDate()+n);return c}
  function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
  function sameDay(a,b){return iso(a)===iso(b)}
  function rangeLabel(start,count){
    var end=addDays(start,count-1);
    var a=MONTHS[start.getMonth()]+" "+start.getDate();
    var b=(start.getMonth()===end.getMonth()?"":MONTHS[end.getMonth()]+" ")+end.getDate();
    return a+"–"+b+", "+end.getFullYear();
  }
  function longWeek(s){return "Week of "+MONTHS_LONG[s.getMonth()]+" "+s.getDate()+", "+s.getFullYear()}
  /* The week you're planning right now. Once the last school day is behind you,
     this rolls forward to the upcoming week — Saturday morning on a Mon–Fri
     schedule, Sunday morning if Saturday is switched on. */
  function currentWeekStart(){
    var now=new Date();
    var dow=(now.getDay()+6)%7;                     // 0=Mon … 5=Sat, 6=Sun
    var lastSchoolDay=data.settings.saturday?5:4;   // Sat or Fri
    var m=mondayOf(now);
    return dow>lastSchoolDay ? addDays(m,7) : m;
  }
  function uid(){return Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4)}
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];})}

  /* ---------- load / save ---------- */
  function load(){
    var mode=Store.init();
    var note=document.getElementById("storeNote");
    if(mode==="memory"){
      var w=document.getElementById("warnBar");
      w.style.display="";
      w.innerHTML="<b>Saving is turned off in this browser.</b> Plans will disappear when you close the tab. Try opening the file in Chrome or Safari, or turn off private browsing.";
    }
    document.getElementById("verNum").textContent=VERSION;
    var lic=document.getElementById("licensee");
    lic.addEventListener("input",function(){data.settings.licensee=lic.value;save()});
    note.textContent = mode==="local"
      ? "Plans are saved on this device, in this browser. Back up before switching computers."
      : "Plans are saved automatically.";
    Store.get(STORE_KEY).then(function(raw){
      if(raw){
        try{
          var p=JSON.parse(raw);
          data={students:p.students||[],plans:p.plans||{},settings:Object.assign({saturday:false,licensee:""},p.settings||{})};
        }catch(e){}
      }
      activeId=data.students.length?data.students[0].id:null;
      lic.value=data.settings.licensee||"";
      weekStart=currentWeekStart();
      activeDay=defaultDay();
      renderAll();
    });
  }
  function flag(msg){
    var f=document.getElementById("savedFlag");
    f.textContent=msg;
    if(msg) setTimeout(function(){ if(f.textContent===msg) f.textContent=""; },1400);
  }
  function save(){
    clearTimeout(saveTimer);
    saveTimer=setTimeout(function(){
      Store.set(STORE_KEY,JSON.stringify(data)).then(function(){flag("Saved")})
        .catch(function(e){console.error(e);flag("Not saved")});
    },400);
  }

  /* ---------- accessors ---------- */
  function student(){for(var i=0;i<data.students.length;i++){if(data.students[i].id===activeId)return data.students[i]}return null}
  function dayCount(){return data.settings.saturday?6:5}
  function planKey(sid,ws){return (sid||activeId)+"|"+iso(ws||weekStart)}
  function plan(sid,ws){
    var k=planKey(sid,ws);
    if(!data.plans[k])data.plans[k]={cells:{},notes:""};
    if(!data.plans[k].cells)data.plans[k].cells={};
    return data.plans[k];
  }
  function peekPlan(sid,ws){return data.plans[planKey(sid,ws)]||null}
  /* Open on today when today is in the week being shown, otherwise Monday. */
  function defaultDay(){
    var n=dayCount(), t=new Date();
    for(var d=0;d<n;d++){ if(sameDay(addDays(weekStart,d),t)) return d; }
    return 0;
  }
  function clampDay(){
    var n=dayCount();
    if(activeDay>=n)activeDay=n-1;
    if(activeDay<0||isNaN(activeDay))activeDay=0;
  }
  function items(day,subId){
    var p=plan(), k=day+"|"+subId;
    if(!p.cells[k])p.cells[k]=[];
    return p.cells[k];
  }

  /* ---------- render ---------- */
  function renderRoster(){
    var ul=document.getElementById("roster"); ul.innerHTML="";
    data.students.forEach(function(s){
      var li=document.createElement("li");
      if(s.editing){
        li.innerHTML='<div class="field"><input type="text" class="ed-name" value="'+esc(s.name)+'" placeholder="Name">'+
          '<input type="text" class="ed-grade" value="'+esc(s.grade||"")+'" placeholder="Grade" style="width:82px"></div>'+
          '<div class="rowbtns"><button class="mini" data-act="savestudent" data-id="'+s.id+'">Save</button>'+
          '<button class="mini" data-act="canceledit" data-id="'+s.id+'">Cancel</button></div>';
      }else{
        li.innerHTML='<button class="student'+(s.id===activeId?" on":"")+'" data-act="pick" data-id="'+s.id+'">'+
          '<span class="nm">'+esc(s.name)+'</span>'+(s.grade?'<span class="gr">'+esc(s.grade)+'</span>':'')+'</button>'+
          (s.id===activeId?'<div class="rowbtns"><button class="mini" data-act="editstudent" data-id="'+s.id+'">Edit</button>'+
          '<button class="mini danger" data-act="delstudent" data-id="'+s.id+'">'+(armed==="del-"+s.id?"Tap again to remove":"Remove")+'</button></div>':'');
      }
      ul.appendChild(li);
    });
  }

  function renderSubjects(){
    var sec=document.getElementById("subjectSection"), s=student();
    sec.style.display=s?"":"none";
    if(!s)return;
    var ul=document.getElementById("subs"); ul.innerHTML="";
    s.subjects.forEach(function(sub,i){
      var li=document.createElement("li");
      if(editingSub===sub.id){
        li.className="ed";
        li.innerHTML='<div class="field"><input type="text" class="ed-sub" data-id="'+sub.id+'" '+
          'value="'+esc(sub.name)+'" placeholder="Subject name" autocomplete="off"></div>'+
          '<div class="rowbtns"><button class="mini" data-act="savesubject" data-id="'+sub.id+'">Save</button>'+
          '<button class="mini" data-act="cancelsubject" data-id="'+sub.id+'">Cancel</button></div>';
      }else{
        li.innerHTML='<span class="ord">'+String(i+1).padStart(2,"0")+'</span>'+
          '<button class="sname" data-act="editsubject" data-id="'+sub.id+'" title="Rename this subject">'+esc(sub.name)+'</button>'+
          '<button class="mini" data-act="up" data-id="'+sub.id+'" aria-label="Move up"'+(i===0?' disabled style="opacity:.3"':'')+'>↑</button>'+
          '<button class="mini" data-act="down" data-id="'+sub.id+'" aria-label="Move down"'+(i===s.subjects.length-1?' disabled style="opacity:.3"':'')+'>↓</button>'+
          '<button class="mini danger" data-act="delsubject" data-id="'+sub.id+'" aria-label="Remove subject">'+(armed==="dels-"+sub.id?"Sure?":"✕")+'</button>';
      }
      ul.appendChild(li);
    });
    var row=document.getElementById("chiprow"); row.innerHTML="";
    SUGGESTIONS.filter(function(n){
      return !s.subjects.some(function(x){return x.name.toLowerCase()===n.toLowerCase()});
    }).slice(0,8).forEach(function(n){
      var b=document.createElement("button");
      b.className="chip"; b.textContent="+ "+n; b.dataset.act="quickadd"; b.dataset.name=n;
      row.appendChild(b);
    });
  }

  function renderSheet(){
    var el=document.getElementById("sheet"), s=student();
    el.innerHTML="";
    var phone=isPhone();
    /* The switcher goes in first so it survives the empty states — otherwise a
       newly added child with no subjects yet strands you with no way back. */
    var strip=phone?phoneStrip():null;
    if(strip)el.appendChild(strip);

    if(!s){
      el.insertAdjacentHTML("beforeend",'<div class="empty"><h3>Start with a student</h3><p>Add a name and grade, choose the subjects you teach, then fill in the week. Everything you type is saved as you go.</p>'+
        (phone?'<button class="btn" data-act="opendrawer">Add a student</button>':'')+'</div>');
      return;
    }
    if(!s.subjects.length){
      el.insertAdjacentHTML("beforeend",'<div class="empty"><h3>Add subjects for '+esc(s.name)+'</h3><p>Subjects become the rows of the weekly grid. Type your own or tap a suggestion.</p>'+
        (phone?'<button class="btn" data-act="opendrawer">Add subjects</button>':'')+'</div>');
      return;
    }
    if(phone){ renderPhoneSheet(el,s); return; }

    var n=dayCount(), today=new Date(), p=plan();
    var head=document.createElement("div");
    head.className="sheethead";
    head.innerHTML='<div class="who"><h3>'+esc(s.name)+'</h3><p>'+(s.grade?esc(s.grade)+" · ":"")+longWeek(weekStart)+'</p></div>'+
      '<div class="tools">'+
        '<label class="toggle"><input type="checkbox" data-act="sat" '+(data.settings.saturday?"checked":"")+'> Saturday</label>'+
        '<button class="btn ghost" data-act="copylast">Copy all rows</button>'+
        '<button class="btn ghost" data-act="clearweek">'+(armed==="clear"?"Tap again to clear":"Clear week")+'</button>'+
        '<button class="btn print" data-act="print">Print this week</button>'+
        (data.students.length>1?'<button class="btn ghost" data-act="printall">Print all students</button>':'')+
      '</div>';
    el.appendChild(head);

    var scroller=document.createElement("div"); scroller.className="scroller";
    var table=document.createElement("table"); table.className="ledger";
    var thead='<thead><tr><th style="width:150px">Subject</th>';
    for(var d=0;d<n;d++){
      var date=addDays(weekStart,d);
      thead+='<th class="'+(sameDay(date,today)?"on":"")+'">'+DAYS[d]+
        '<span class="dnum">'+MONTHS[date.getMonth()]+" "+date.getDate()+'</span></th>';
    }
    table.innerHTML=thead+'</tr></thead>';
    var tbody=document.createElement("tbody");
    s.subjects.forEach(function(sub){
      var tr=document.createElement("tr");
      var td0=document.createElement("td");
      td0.className="subcell";
      var armedRow=(armed==="row-"+sub.id);
      td0.innerHTML='<div class="subwrap"><span class="snm">'+esc(sub.name)+'</span>'+
        '<button class="pullrow'+(armedRow?" warn-arm":"")+'" data-act="copyrow" data-sub="'+sub.id+'" '+
        'title="Copy this subject from last week">'+(armedRow?"↺ Replace row?":"↺ Last week")+'</button></div>';
      tr.appendChild(td0);
      for(var d=0;d<n;d++){
        var td=document.createElement("td");
        td.className="day cell"+(sameDay(addDays(weekStart,d),today)?" on":"");
        td.dataset.day=d; td.dataset.sub=sub.id;
        fillCell(td);
        tr.appendChild(td);
      }
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    scroller.appendChild(table);
    el.appendChild(scroller);

    el.appendChild(buildNotes());
  }

  /* Phone: one day at a time, subjects stacked. Same data, same cell
     contract (.cell with data-day + data-sub), so fillCell/itemRow are shared. */
  function phoneStrip(){
    if(data.students.length<2)return null;
    var strip=document.createElement("div");
    strip.className="pstrip";
    var html="";
    data.students.forEach(function(x){
      html+='<button data-act="pick" data-id="'+x.id+'"'+(x.id===activeId?' class="on"':'')+'>'+esc(x.name)+'</button>';
    });
    strip.innerHTML=html;
    return strip;
  }

  function renderPhoneSheet(el,s){
    clampDay();
    var n=dayCount(), today=new Date(), d;

    var head=document.createElement("div");
    head.className="sheethead";
    head.innerHTML='<div class="who"><h3>'+esc(s.name)+'</h3><p>'+(s.grade?esc(s.grade)+" · ":"")+longWeek(weekStart)+'</p></div>'+
      '<div class="tools">'+
        '<button class="btn print" data-act="print">Print this week</button>'+
        (data.students.length>1?'<button class="btn ghost" data-act="printall">Print all</button>':'')+
        '<button class="btn ghost" data-act="copylast">Copy last week</button>'+
        '<button class="btn ghost" data-act="clearweek">'+(armed==="clear"?"Tap again to clear":"Clear week")+'</button>'+
      '</div>';
    el.appendChild(head);

    var tabs=document.createElement("div");
    tabs.className="daytabs";
    var thtml="";
    for(d=0;d<n;d++){
      var date=addDays(weekStart,d);
      thtml+='<button data-act="setday" data-day="'+d+'"'+
        ' aria-pressed="'+(d===activeDay?"true":"false")+'"'+
        ' class="'+(d===activeDay?"on":"")+(sameDay(date,today)?" today":"")+'">'+
        DAYS_SHORT[d]+'<span class="dd">'+date.getDate()+'</span></button>';
    }
    tabs.innerHTML=thtml;
    el.appendChild(tabs);

    s.subjects.forEach(function(sub){
      var card=document.createElement("div"); card.className="scard";
      var armedRow=(armed==="row-"+sub.id);
      var h=document.createElement("div"); h.className="scardhead";
      h.innerHTML='<span class="snm">'+esc(sub.name)+'</span>'+
        '<button class="pullrow'+(armedRow?" warn-arm":"")+'" data-act="copyrow" data-sub="'+sub.id+'">'+
        (armedRow?"↺ Replace row?":"↺ Last week")+'</button>';
      card.appendChild(h);
      var cell=document.createElement("div");
      cell.className="cell";
      cell.dataset.day=activeDay; cell.dataset.sub=sub.id;
      fillCell(cell);
      card.appendChild(cell);
      el.appendChild(card);
    });

    el.appendChild(buildNotes());
  }

  function buildNotes(){
    var p=plan();
    var notes=document.createElement("div");
    notes.className="notes";
    notes.innerHTML='<label for="weeknotes">Notes for the week</label>'+
      '<textarea id="weeknotes" placeholder="Field trip Thursday, co-op at 1:00…"></textarea>';
    var ta=notes.querySelector("textarea");
    ta.value=p.notes||"";
    ta.addEventListener("input",function(){plan().notes=ta.value;save()});
    return notes;
  }

  function fillCell(td){
    var d=+td.dataset.day, subId=td.dataset.sub, list=items(d,subId);
    td.innerHTML="";
    list.forEach(function(text,i){td.appendChild(itemRow(d,subId,i,text,false))});
    td.appendChild(itemRow(d,subId,list.length,"",true));
  }

  function itemRow(d,subId,index,text,isNew){
    var row=document.createElement("div");
    row.className="item";
    row.innerHTML='<span class="box"></span>';
    var inp=document.createElement("input");
    inp.type="text"; inp.value=text; inp.placeholder=isNew?"Add a lesson":"";
    row.appendChild(inp);

    if(!isNew){
      var x=document.createElement("button");
      x.className="x"; x.type="button"; x.textContent="✕"; x.setAttribute("aria-label","Remove lesson");
      x.addEventListener(DOWN,function(e){
        e.preventDefault();
        items(d,subId).splice(index,1); save(); fillCell(row.closest(".cell"));
      });
      row.appendChild(x);
    }

    inp.addEventListener("input",function(){
      var list=items(d,subId);
      if(isNew){
        if(inp.value.trim()==="")return;
        list.push(inp.value);
        var td=row.closest(".cell");
        save(); fillCell(td);
        var inputs=td.querySelectorAll(".item input");
        var target=inputs[list.length-1];
        target.focus(); target.setSelectionRange(target.value.length,target.value.length);
      }else{ list[index]=inp.value; save(); }
    });

    inp.addEventListener("keydown",function(e){
      var td=row.closest(".cell");
      if(e.key==="Enter"){
        e.preventDefault();
        var inputs=Array.prototype.slice.call(td.querySelectorAll(".item input"));
        var last=inputs[inputs.length-1];
        if(inp===last&&inp.value.trim()===""){inp.blur();return}
        last.focus();
      }
      if(e.key==="Backspace"&&inp.value===""&&!isNew){
        e.preventDefault();
        items(d,subId).splice(index,1); save(); fillCell(td);
        var ins=td.querySelectorAll(".item input");
        var prev=ins[Math.max(0,index-1)];
        if(prev){prev.focus();prev.setSelectionRange(prev.value.length,prev.value.length)}
      }
      if(e.key==="Escape")inp.blur();
    });

    inp.addEventListener("blur",function(){
      if(!isNew&&inp.value.trim()===""){
        items(d,subId).splice(index,1); save(); fillCell(row.closest(".cell"));
      }
    });
    return row;
  }

  function renderAll(){
    document.getElementById("weeklabel").textContent=rangeLabel(weekStart,dayCount());
    var sd=document.getElementById("satDrawer");
    if(sd)sd.checked=!!data.settings.saturday;
    renderRoster(); renderSubjects(); renderSheet();
  }

  /* ---------- drawer ---------- */
  function setDrawer(open){
    document.body.classList.toggle("drawer",!!open);
    var h=document.querySelector(".hamb");
    if(h)h.setAttribute("aria-expanded",open?"true":"false");
    if(open){
      var c=document.querySelector(".drawerclose");
      if(c&&c.focus)c.focus();
    }
  }

  /* ---------- print ---------- */
  function buildPrint(list){
    var n=dayCount();
    document.getElementById("printroot").innerHTML=list.map(function(s){
      if(!s.subjects.length)return "";
      var p=peekPlan(s.id,weekStart)||{cells:{},notes:""};
      var head='<tr><th>Subject</th>';
      for(var d=0;d<n;d++){
        var date=addDays(weekStart,d);
        head+='<th>'+DAYS_SHORT[d]+'<span class="pdate">'+MONTHS[date.getMonth()]+" "+date.getDate()+'</span></th>';
      }
      var rows=s.subjects.map(function(sub){
        var tds='<td class="psub">'+esc(sub.name)+'</td>';
        for(var d=0;d<n;d++){
          var cell=(p.cells&&p.cells[d+"|"+sub.id])||[];
          tds+='<td class="pday">'+cell.filter(function(t){return t.trim()!==""}).map(function(t){
            return '<div class="pitem"><span class="pbox"></span><span>'+esc(t)+'</span></div>';
          }).join("")+'</td>';
        }
        return '<tr>'+tds+'</tr>';
      }).join("");
      return '<div class="psheet"><div class="phead"><h1>'+esc(s.name)+'</h1>'+
        (s.grade?'<div class="pgrade">'+esc(s.grade)+'</div>':'')+
        '<div class="pweek">'+longWeek(weekStart)+'</div></div>'+
        '<table class="pgrid"><thead>'+head+'</tr></thead><tbody>'+rows+'</tbody></table>'+
        '<div class="pnotes"><b>Notes</b><div class="ptext">'+esc(p.notes||"")+'</div></div>'+
        '<div class="pfoot">Check each box as you finish.'+
        (data.settings.licensee?'<span class="plic">'+esc(data.settings.licensee)+'</span>':'')+
        '</div></div>';
    }).join("");
  }
  function doPrint(all){
    var list=all?data.students:(student()?[student()]:[]);
    if(!list.length)return;
    buildPrint(list);
    setTimeout(function(){window.print()},60);
  }

  /* ---------- backup / restore ---------- */
  function backup(){
    var blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a");
    a.href=url; a.download="lesson-plans-"+iso(new Date())+".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){URL.revokeObjectURL(url)},1000);
    flag("Backed up");
  }
  document.getElementById("restoreFile").addEventListener("change",function(e){
    var f=e.target.files[0]; if(!f)return;
    var r=new FileReader();
    r.onload=function(){
      try{
        var p=JSON.parse(r.result);
        if(!p||!p.students)throw new Error("bad file");
        data={students:p.students,plans:p.plans||{},settings:Object.assign({saturday:false,licensee:""},p.settings||{})};
        data.students.forEach(function(s){s.editing=false});
        activeId=data.students.length?data.students[0].id:null;
        document.getElementById("licensee").value=data.settings.licensee||"";
        editingSub=null; weekStart=currentWeekStart(); activeDay=defaultDay();
        save(); renderAll(); flag("Restored");
        if(isPhone())setDrawer(false);
      }catch(err){
        var w=document.getElementById("warnBar");
        w.style.display=""; w.innerHTML="<b>That file didn't load.</b> Choose a backup file saved from this planner (it ends in .json).";
      }
    };
    r.readAsText(f);
    e.target.value="";
  });

  /* ---------- actions ---------- */
  function arm(token,redraw){
    if(armed===token){armed=null;return true}
    armed=token;
    if(redraw)redraw();
    setTimeout(function(){if(armed===token){armed=null;renderAll()}},3500);
    return false;
  }
  function addStudent(){
    var nameEl=document.getElementById("newStudentName"), gradeEl=document.getElementById("newStudentGrade");
    var name=nameEl.value.trim();
    if(!name){nameEl.focus();return}
    var s={id:uid(),name:name,grade:gradeEl.value.trim(),subjects:[]};
    data.students.push(s); activeId=s.id;
    nameEl.value=""; gradeEl.value="";
    save(); renderAll(); document.getElementById("newStudentName").focus();
  }
  function addSubject(name){
    var s=student(); if(!s)return;
    var inp=document.getElementById("newSubject");
    var val=(name||inp.value).trim();
    if(!val){inp.focus();return}
    if(s.subjects.some(function(x){return x.name.toLowerCase()===val.toLowerCase()})){inp.value="";return}
    s.subjects.push({id:uid(),name:val});
    if(!name)inp.value="";
    save(); renderAll();
  }

  function startSubjectEdit(id){
    editingSub=id; armed=null; renderSubjects();
    var f=document.querySelector(".ed-sub");
    if(f){f.focus(); f.select();}
  }
  function cancelSubjectEdit(){ editingSub=null; renderSubjects(); }
  function saveSubjectEdit(id){
    var s=student(); if(!s){editingSub=null;return}
    var f=document.querySelector('.ed-sub[data-id="'+id+'"]');
    var sub=s.subjects.filter(function(x){return x.id===id})[0];
    if(!f||!sub){editingSub=null;renderSubjects();return}
    var val=f.value.trim();
    if(!val){f.focus();return}                       // never let a subject go nameless
    var clash=s.subjects.some(function(x){
      return x.id!==id && x.name.toLowerCase()===val.toLowerCase();
    });
    if(clash){ flag("Already there"); f.focus(); f.select(); return; }
    sub.name=val;                                    // cells key off id, so plans follow the rename
    editingSub=null;
    save(); renderAll(); flag("Renamed");
  }

  document.addEventListener("click",function(e){
    var t=e.target.closest("[data-act]"); if(!t)return;
    var act=t.dataset.act, id=t.dataset.id, s;

    if(act==="opendrawer"){setDrawer(true);return}
    if(act==="closedrawer"){setDrawer(false);return}
    if(act==="setday"){activeDay=+t.dataset.day;armed=null;renderSheet();return}

    if(act==="prevweek"){weekStart=addDays(weekStart,-7);armed=null;editingSub=null;activeDay=defaultDay();renderAll()}
    if(act==="nextweek"){weekStart=addDays(weekStart,7);armed=null;editingSub=null;activeDay=defaultDay();renderAll()}
    if(act==="thisweek"){weekStart=currentWeekStart();armed=null;editingSub=null;activeDay=defaultDay();renderAll()}
    if(act==="addstudent")addStudent();
    if(act==="pick"){activeId=id;armed=null;editingSub=null;renderAll();if(isPhone())setDrawer(false)}
    if(act==="editstudent"){
      data.students.forEach(function(x){x.editing=false});
      s=data.students.filter(function(x){return x.id===id})[0]; if(s)s.editing=true;
      renderRoster();
      var f=document.querySelector(".ed-name"); if(f)f.focus();
    }
    if(act==="canceledit"){
      s=data.students.filter(function(x){return x.id===id})[0]; if(s)s.editing=false;
      renderRoster();
    }
    if(act==="savestudent"){
      s=data.students.filter(function(x){return x.id===id})[0];
      if(s){
        var nm=document.querySelector(".ed-name").value.trim();
        s.name=nm||s.name;
        s.grade=document.querySelector(".ed-grade").value.trim();
        s.editing=false;
      }
      save(); renderAll();
    }
    if(act==="delstudent"){
      if(arm("del-"+id,renderRoster)){
        data.students=data.students.filter(function(x){return x.id!==id});
        Object.keys(data.plans).forEach(function(k){if(k.indexOf(id+"|")===0)delete data.plans[k]});
        if(activeId===id)activeId=data.students.length?data.students[0].id:null;
        save(); renderAll();
      }
    }
    if(act==="addsubject")addSubject();
    if(act==="quickadd")addSubject(t.dataset.name);
    if(act==="editsubject")startSubjectEdit(id);
    if(act==="savesubject")saveSubjectEdit(id);
    if(act==="cancelsubject")cancelSubjectEdit();
    if(act==="delsubject"){
      editingSub=null;
      if(arm("dels-"+id,renderSubjects)){
        s=student();
        s.subjects=s.subjects.filter(function(x){return x.id!==id});
        Object.keys(data.plans).forEach(function(k){
          var p=data.plans[k];
          if(p&&p.cells)Object.keys(p.cells).forEach(function(ck){if(ck.split("|")[1]===id)delete p.cells[ck]});
        });
        save(); renderAll();
      }
    }
    if(act==="up"||act==="down"){
      s=student();
      var i=-1;
      s.subjects.forEach(function(x,ix){if(x.id===id)i=ix});
      var j=act==="up"?i-1:i+1;
      if(j>=0&&j<s.subjects.length){
        var tmp=s.subjects[i]; s.subjects[i]=s.subjects[j]; s.subjects[j]=tmp;
        save(); renderAll();
      }
    }
    if(act==="copylast"){
      var prev=peekPlan(activeId,addDays(weekStart,-7));
      if(!prev){t.textContent="Nothing there yet";setTimeout(renderAll,1600);return}
      plan().cells=JSON.parse(JSON.stringify(prev.cells||{}));
      save(); renderAll();
    }
    if(act==="copyrow"){
      var rid=t.dataset.sub, days=dayCount();
      var last=peekPlan(activeId,addDays(weekStart,-7));
      var filled=function(src,key){
        var c=src&&src.cells&&src.cells[key];
        return !!(c&&c.some(function(x){return x.trim()!==""}));
      };
      var hasLast=false, hasNow=false, dd;
      for(dd=0;dd<days;dd++){ if(filled(last,dd+"|"+rid)){hasLast=true;break} }
      if(!hasLast){
        t.textContent="Nothing last week";
        setTimeout(renderAll,1600);
        return;
      }
      var cur=plan();
      for(dd=0;dd<days;dd++){ if(filled(cur,dd+"|"+rid)){hasNow=true;break} }
      if(hasNow && !arm("row-"+rid,renderSheet)) return;
      armed=null;
      for(dd=0;dd<days;dd++){
        var key=dd+"|"+rid, src=last.cells[key];
        if(src&&src.length) cur.cells[key]=src.slice();
        else delete cur.cells[key];
      }
      save(); renderAll(); flag("Row copied");
    }
    if(act==="clearweek"){
      if(arm("clear",renderSheet)){
        var p=plan(); p.cells={}; p.notes="";
        save(); renderAll();
      }
    }
    if(act==="print")doPrint(false);
    if(act==="printall")doPrint(true);
    if(act==="backup")backup();
    if(act==="restore")document.getElementById("restoreFile").click();
  });

  document.addEventListener("change",function(e){
    if(e.target.dataset&&e.target.dataset.act==="sat"){
      data.settings.saturday=e.target.checked; clampDay(); save(); renderAll();
    }
  });

  document.addEventListener("keydown",function(e){
    var t=e.target;
    if(e.key==="Escape"&&document.body.classList.contains("drawer")&&
       !(t.classList&&t.classList.contains("ed-sub"))){
      setDrawer(false); return;
    }
    if(t.classList&&t.classList.contains("ed-sub")){
      if(e.key==="Enter"){e.preventDefault(); saveSubjectEdit(t.dataset.id)}
      else if(e.key==="Escape"){e.preventDefault(); cancelSubjectEdit()}
      return;
    }
    if(e.key!=="Enter")return;
    var id=t.id;
    if(id==="newStudentName"||id==="newStudentGrade")addStudent();
    if(id==="newSubject")addSubject();
  });

  /* Rotating a phone, or dragging a desktop window narrow, swaps layouts. */
  var resizeTimer=null;
  window.addEventListener("resize",function(){
    clearTimeout(resizeTimer);
    resizeTimer=setTimeout(function(){
      var now=isPhone();
      if(now===phoneMode)return;
      phoneMode=now;
      if(!now)setDrawer(false);
      armed=null; editingSub=null;
      renderAll();
    },120);
  });

  load();
})();
</script>
</body>
</html>
